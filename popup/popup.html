<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Privacy Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container" id="popup">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon128.png" alt="" width="22" height="22" class="logo">
        <span class="title">AI Privacy Guard</span>
      </div>
      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">Active</span>
      </div>
    </header>

    <!-- Main Switch Card -->
    <div class="card toggle-card">
      <div class="toggle-info">
        <span class="toggle-title">Real-time Protection</span>
        <span class="toggle-sub" id="toggle-sub">Monitoring AI prompts</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-protection" checked role="switch">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-num" id="stat-detected">0</span>
        <span class="stat-lbl">Detected Today</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="stat-redacted">0</span>
        <span class="stat-lbl">Redacted Today</span>
      </div>
    </div>

    <!-- Info List -->
    <div class="card info-list">
      <div class="info-row">
        <span class="info-label">Local Detection</span>
        <span class="info-value positive" id="local-detection">Enabled</span>
      </div>
      <div class="info-row">
        <span class="info-label">Supported Platforms</span>
        <span class="info-value">All AI Websites</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>100% Local processing. Zero data transmitted.</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
